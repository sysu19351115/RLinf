defaults:
  - env/gym_aloha@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout

# Launch via:   bash evaluations/run_eval.sh gym_aloha gym_aloha_grpo_openpi_pi0_eval
#    or:        bash evaluations/run_eval.sh gym_aloha_grpo_openpi_pi0_eval
# Requires the gym-aloha package:   pip install gym-aloha

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "gym_aloha_grpo_openpi_pi0_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    seed: 42
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    group_size: 1
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "checkpoints/pi0_aloha_sim_pytorch"
    num_action_chunks: 10
    action_dim: 14
    openpi:
      config_name: "pi0_gym_aloha"
      num_images_in_input: 1
