defaults:
  - env/realworld_rebot@env.eval
  - model/pi0@rollout.model
  - override hydra/job_logging: stdout

# Launch via:   bash evaluations/run_eval.sh realworld realworld_rebot_eval
# Requires the reBotArm SDK installed: motorbridge, pinocchio, numpy

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout:
      node_group: rebot
      placement: 0
    env:
      node_group: rebot
      placement: 0
  node_groups:
    - label: rebot
      node_ranks: 0
      hardware:
        type: RebotArm
        configs:
          - can_interface: can0
            camera_serials: []    # Replace with your D435 serial if using camera
            node_rank: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "realworld-rebot-eval"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: 1
  only_eval: True
  val_check_interval: -1

env:
  group_name: "EnvGroup"
  enable_offload: False

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False
  model:
    model_path: MODEL_PATH   # Replace with your checkpoint directory
    num_action_chunks: 4
    action_dim: 7
    openpi:
      config_name: "pi0_rebotarm"
      num_images_in_input: 0
