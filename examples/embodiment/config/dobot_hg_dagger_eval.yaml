defaults:
  - dobot_hg_dagger_openpi_pytorch
  - _self_

# Standalone, label-only autonomous evaluation for a Dobot HG-DAgger
# checkpoint. This reuses evaluations/eval_embodied_agent.py; no actor/trainer
# worker is launched when runner.only_eval=True.
runner:
  task_type: embodied_eval
  only_eval: True
  val_check_interval: -1
  max_epochs: 1
  max_steps: 1
  ckpt_path: ${oc.env:DOBOT_HG_DAGGER_EVAL_CHECKPOINT}
  eval_checkpoint_id: ${oc.env:DOBOT_HG_DAGGER_EVAL_CHECKPOINT_ID}
  logger:
    experiment_name: "dobot-hg-dagger-autonomous-eval"

env:
  eval:
    rollout_epoch: 20
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    override_cfg:
      # Hardware evaluation must explicitly override this to false.
      is_dummy: True
      action_mode: "cartesian"
      state_mode: "pose"
      use_dense_reward: False
      use_reward_model: False
      manual_episode_control_only: True
      max_num_steps: 500
      step_frequency: 30.0
      # Explicitly mirror training safety params so evaluation cannot drift
      # if DobotRobotConfig defaults change.
      initial_joint_pos: [-5.87, -0.799, -2.175, 1.89, 1.424, 0.621, 0.9]
      gripper_relative_threshold: 0.2
      reset_fps: 30.0
      reset_min_duration_s: 3.0
      reset_max_duration_s: 20.0
      reset_max_velocity_deg_s: 20.0
      reset_max_acceleration_deg_s2: 30.0
      reset_max_step_deg: 1.0
      reset_feedback_interval_frames: 3
      reset_max_tracking_error_deg: 8.0
      reset_final_tolerance_deg: 1.0
      reset_final_hold_frames: 10
      reset_gripper_release_settle_s: 0.5
      task_description: "Pick up an object with the hole from the tray and hang it on an empty hook."
    use_keyboard_intervention: True
    use_intervention_in_dummy: True
    keyboard_intervention:
      position_delta: 0.002
      rotation_delta: 0.02
      gripper_delta: 0.05
      base_frame_euler_deg: [0, 0, 0]
      toggle_key: "h"
      model_key: "m"
      done_key: "Key.enter"
      abort_key: "Key.backspace"
      quit_keys: ["Key.esc"]
      start_in_engage: False
      allow_motion_intervention: False
      episode_control_mode: "online"
      wait_for_start_on_reset: True
      start_key: "y"
      start_gate_timeout_s: 600.0
    data_collection:
      enabled: False

# The actor is not launched in only-eval mode. Override the inherited required
# training LR so evaluation requires only model/norm/checkpoint identity.
actor:
  optim:
    lr: 0.0
