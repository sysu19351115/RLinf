defaults:
  - env/realworld_dobot@env.train
  - env/realworld_dobot@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# Dobot CR5AF + pi0.5 + Pose mode (ServoP) — single local node
# Launch: python examples/embodiment/train_async.py --config-name dobot_single_node_ppo_pi05_pose
#
# This config is for the 8-dim pose policy (pi05_dobot_pose):
#   action = [x,y,z m, qw,qx,qy,qz, gripper 0..1]
#   state  = [x,y,z m, qw,qx,qy,qz, gripper 0..1] + prev_state
# The joint variant uses dobot_single_node_ppo_pi05.yaml instead.

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: local_gpu
      placement: 0
    rollout:
      node_group: local_gpu
      placement: 0
    env:
      node_group: dobot
      placement: 0
  node_groups:
    - label: local_gpu
      node_ranks: 0
    - label: dobot
      node_ranks: 0
      hardware:
        type: Dobot
        configs:
          - ip: "192.168.5.1"
            speed: 100
            action_mode: "cartesian"
            state_mode: "pose"
            gripper_port: "/dev/ttyACM0"
            camera_serials:
              - "cam_high_serial"
              - "cam_left_wrist_serial"
            camera_type: "realsense"
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "dobot-pi05-pose-single-node-ppo"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 20
    ignore_terminations: False
    total_num_envs: 1
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    override_cfg:
      is_dummy: False
      use_dense_reward: True
      max_num_steps: 500
      action_mode: "cartesian"
      state_mode: "pose"
      target_ee_pose: [0.3, -0.2, 0.15, 3.14, 0.0, 0.0]
      reward_threshold: [0.02, 0.02, 0.02, 0.2, 0.2, 0.2]

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    override_cfg:
      is_dummy: False
      max_num_steps: 500
      action_mode: "cartesian"
      state_mode: "pose"
      target_ee_pose: [0.3, -0.2, 0.15, 3.14, 0.0, 0.0]

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 20
  global_batch_size: 160
  seed: 0
  enable_offload: False

  model:
    model_path: "checkpoints/pi05_dobot_pose"
    model_type: "openpi"
    add_value_head: True
    is_lora: False
    num_action_chunks: 10
    action_dim: 8                                 # pose mode: 8-dim [x,y,z, qw,qx,qy,qz, gripper]
    num_steps: 4
    openpi:
      config_name: "pi05_dobot_pose"
      train_expert_only: True
      value_after_vlm: True
      num_images_in_input: 2
      noise_method: "flow_noise"
      action_horizon: 15
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
    openpi_data:
      repo_id: ""

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 2

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
