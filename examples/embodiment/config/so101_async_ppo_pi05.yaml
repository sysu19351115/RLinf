defaults:
  - env/realworld_so101@env.train
  - env/realworld_so101@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# SO101 bimanual + pi0.5 + Async PPO — cloud GPU + local robot
# Cloud training footprint is intentionally kept smaller than the single-node config.

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: cloud
      placement: 0
    rollout:
      node_group: robot             # rollout runs on the robot node alongside env
      placement: 0
    env:
      node_group: robot
      placement: 0
  node_groups:
    - label: cloud
      node_ranks: 0                 # actor
    - label: robot
      node_ranks: 1                 # rollout + real-world env
      hardware:
        type: SO101Arm
        configs:
          - left_follower_port: "/dev/ttyACM0"
            right_follower_port: "/dev/ttyACM1"
            left_wrist_camera:
              index_or_path: "/dev/video2"
              width: 640
              height: 480
              fps: 30
              fourcc: "MJPG"
            right_wrist_camera:
              index_or_path: "/dev/video4"
              width: 640
              height: 480
              fps: 30
              fourcc: "MJPG"
            left_global_camera:
              index_or_path: "/dev/video0"
              width: 640
              height: 480
              fps: 25
              fourcc: "MJPG"
            robot_id: "bi"
            max_relative_target: 5.0
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101-pi05-async-ppo"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2
    ignore_terminations: False
    total_num_envs: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    override_cfg:
      is_dummy: False
      tele_mode: true
      use_dense_reward: False
      use_reward_model: False
      max_num_steps: 240
      # Physical rest/reset pose recorded from the actual robot (RLinf units).
      initial_joints: [3.96, -100.24, 96.91, 75.56, 1.49, 2.70, -3.49, -99.84, 101.71, 74.55, 5.54, 1.99]

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    override_cfg:
      is_dummy: False
      tele_mode: true
      use_reward_model: False
      max_num_steps: 240
      initial_joints: [3.96, -100.24, 96.91, 75.56, 1.49, 2.70, -3.49, -99.84, 101.71, 74.55, 5.54, 1.99]

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 10
  global_batch_size: 120
  seed: 0
  enable_offload: False

  model:
    model_path: "checkpoints/pi05_so101_cache_torch"
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 4
    action_dim: 12
    num_steps: 4
    openpi:
      config_name: "pi05_so101"
      value_after_vlm: True
      num_images_in_input: 3
      noise_method: "flow_noise"
      action_horizon: 6
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
    openpi_data:
      repo_id: ""

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 2

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
