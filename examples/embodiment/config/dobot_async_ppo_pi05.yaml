defaults:
  - env/realworld_dobot@env.train
  - env/realworld_dobot@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# Dobot CR5AF + pi0.5 Pose + Async PPO — cloud GPU + robot GPU (2 nodes)
# rank 0 (cloud): actor; rank 1 (robot): rollout + env.
#
# Launch on head (cloud) node:
#   python examples/embodiment/train_async.py --config-name dobot_async_ppo_pi05

dobot:
  # ── Hardware connection ──
  ip: "192.168.5.1"
  speed: 5
  gripper_port: "/dev/ttyACM0"
  camera_serials:
    - "/dev/v4l/by-id/usb-RYS_CAMERA071101_2026071101-video-index0"
  camera_type: "opencv"
  camera_resolution: [1920, 1080]
  camera_fps: 30
  camera_fourcc: "MJPG"

  # ── Motion control mode ──
  action_mode: "cartesian"
  state_mode: "pose"
  gripper_relative_threshold: 0.2         # latch gripper to fully open/closed

  # ── Reset pose [j1..j6 rad, gripper norm] ──
  initial_joint_pos: [-5.87, -0.799, -2.175, 1.89, 1.424, 0.621, 0.9]

  # ── Episode semantics ──
  max_num_steps: 500
  max_episode_steps: 500
  max_steps_per_rollout_epoch: 500
  total_num_envs: 1
  ignore_terminations: False

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: cloud
      placement: 0
    rollout:
      node_group: robot
      placement: 0
    env:
      node_group: robot
      placement: 0
  node_groups:
    - label: cloud
      node_ranks: 0                       # cloud GPU node: actor
    - label: robot
      node_ranks: 1                       # robot GPU node: rollout + env
      hardware:
        type: Dobot
        configs:
          - ip: ${dobot.ip}
            speed: ${dobot.speed}
            action_mode: ${dobot.action_mode}
            state_mode: ${dobot.state_mode}
            gripper_port: ${dobot.gripper_port}
            camera_serials: ${dobot.camera_serials}
            camera_type: ${dobot.camera_type}
            camera_resolution: ${dobot.camera_resolution}
            camera_fps: ${dobot.camera_fps}
            camera_fourcc: ${dobot.camera_fourcc}
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "dobot-pi05-pose-async-ppo"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2                    # Reduced for async cross-node overhead
    ignore_terminations: ${dobot.ignore_terminations}
    total_num_envs: ${dobot.total_num_envs}
    max_episode_steps: ${dobot.max_episode_steps}
    max_steps_per_rollout_epoch: ${dobot.max_steps_per_rollout_epoch}
    override_cfg:
      is_dummy: False
      use_dense_reward: False
      use_reward_model: True
      reward_mode: terminal
      reward_image_key: "cam_left_wrist"
      reward_worker_node_rank: 0
      reward_worker_hardware_rank: 0
      reward_worker_node_group: "cloud"
      reward_worker_cfg:
        use_reward_model: True
        model:
          model_type: "human"
          human_reward_url: "http://127.0.0.1:12345"
          timeout: 600.0
          server_wait_timeout: 60.0
          default_reward: 0.0
          task_description: "pick up the plug and plug it into the socket"
      max_num_steps: ${dobot.max_num_steps}
      action_mode: ${dobot.action_mode}
      state_mode: ${dobot.state_mode}
      initial_joint_pos: ${dobot.initial_joint_pos}
      gripper_relative_threshold: ${dobot.gripper_relative_threshold}

  eval:
    rollout_epoch: 1
    total_num_envs: ${dobot.total_num_envs}
    max_episode_steps: ${dobot.max_episode_steps}
    max_steps_per_rollout_epoch: ${dobot.max_steps_per_rollout_epoch}
    override_cfg:
      is_dummy: False
      use_dense_reward: False
      use_reward_model: True
      reward_mode: terminal
      reward_image_key: "cam_left_wrist"
      reward_worker_node_rank: 0
      reward_worker_hardware_rank: 0
      reward_worker_node_group: "cloud"
      reward_worker_cfg:
        use_reward_model: True
        model:
          model_type: "human"
          human_reward_url: "http://127.0.0.1:12345"
          timeout: 600.0
          server_wait_timeout: 60.0
          default_reward: 0.0
          task_description: "pick up the plug and plug it into the socket"
      max_num_steps: ${dobot.max_num_steps}
      action_mode: ${dobot.action_mode}
      state_mode: ${dobot.state_mode}
      initial_joint_pos: ${dobot.initial_joint_pos}
      gripper_relative_threshold: ${dobot.gripper_relative_threshold}

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 10                # Reduced for cloud footprint
  global_batch_size: 100              # 100 % 10 == 0; rollout_per_rank=100
  seed: 0
  enable_offload: False

  model:
    model_path: ${project_path:checkpoints/pi05_dobot_t265_pose_train_800_torch}
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 10             # Dobot action_horizon=50; env executes first 10
    action_dim: 8                     # env action dim; config.json's 32 is OpenPI pad
    num_steps: 4
    openpi:
      config_name: "pi05_dobot_pose"
      train_expert_only: True
      value_after_vlm: True
      num_images_in_input: 2
      noise_method: "flow_noise"
      action_horizon: 50              # matches checkpoint config.json
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
    openpi_data:
      repo_id: ""
      norm_stats_path: ${project_path:checkpoints/pi05_dobot_t265_pose_train_800_torch/assets/dobot_cf5af_t265_pose/norm_stats.json}

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 2

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False
  reward_mode: terminal

critic:
  use_critic_model: False
