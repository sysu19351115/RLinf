defaults:
  - dobot_hg_dagger_openpi
  - _self_

# Two-node production topology. Algorithm/model/env semantics are inherited
# unchanged from dobot_hg_dagger_openpi.yaml.
#
# Topology:
#   node 0 (inference, 5090 32GB): actor only — model + optimizer + gradients
#   node 1 (robot, 5070 Ti 16GB): rollout (inference model) + env (Dobot hardware)
cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: inference
      placement: 0
    rollout:
      node_group: robot
      placement: 0
    env:
      node_group: robot
      placement: 0
  node_groups:
    - label: inference
      node_ranks: 0
    - label: robot
      node_ranks: 1
      hardware:
        type: Dobot
        configs:
          - node_rank: 1
            ip: "192.168.5.2"
            speed: 5
            user_index: 0
            tool_index: 2
            action_mode: "cartesian"
            state_mode: "pose"
            gripper_port: "/dev/ttyACM0"
            gripper_closed_deg: 0.0
            gripper_open_deg: -300.0
            camera_serials:
              - "/dev/video0"
            camera_type: "opencv"
            camera_resolution: [1920, 1080]
            camera_fps: 30
            camera_fourcc: "MJPG"

runner:
  logger:
    experiment_name: "dobot-hg-dagger-openpi-two-node"
