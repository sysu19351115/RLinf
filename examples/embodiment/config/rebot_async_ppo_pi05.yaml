defaults:
  - env/realworld_rebot@env.train
  - env/realworld_rebot@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# ReBot Arm B601 + pi0.5 + Async PPO — cloud GPU + local robot
# Cloud training footprint is intentionally kept smaller than the single-node config.

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: cloud
      placement: 0
    rollout:
      node_group: robot             # actor + rollout both run on the training node
      placement: 0
    env:
      node_group: robot
      placement: 0
  node_groups:
    - label: cloud
      node_ranks: 0                 # 192.168.3.223: actor + rollout
    - label: robot
      node_ranks: 1                 # 192.168.3.66: real-world env
      hardware:
        type: RebotArm
        configs:
          - can_interface: can0
            camera_serials:
              - "148522073709"
            camera_type: "realsense"
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rebot-pi05-async-ppo"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 2        # Reduced to shorten single rollout time
    ignore_terminations: False
    total_num_envs: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240          # 240 % 4 == 0 ✓; 10*240/4=600 % 120 == 0 ✓
    override_cfg:
      is_dummy: False
      use_dense_reward: False
      use_reward_model: True
      reward_image_key: "wrist_1"
      reward_worker_cfg:
        use_reward_model: True
        model:
          model_type: "resnet"
          model_path: "/home/tyz/project/RLinf/logs/rebot_reward_model/rebot_reward_training/checkpoints/best_model/actor/model_state_dict/full_weights.pt"
          arch: "resnet18"
          hidden_dim: 256
          dropout: 0.1
          image_size: [3, 224, 224]
          normalize: true
          precision: "fp32"
      max_num_steps: 240

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240          # 240 % 4 == 0 ✓
    override_cfg:
      is_dummy: False
      use_reward_model: True
      reward_image_key: "wrist_1"
      reward_worker_cfg:
        use_reward_model: True
        model:
          model_type: "resnet"
          model_path: "/home/tyz/project/RLinf/logs/rebot_reward_model/rebot_reward_training/checkpoints/best_model/actor/model_state_dict/full_weights.pt"
          arch: "resnet18"
          hidden_dim: 256
          dropout: 0.1
          image_size: [3, 224, 224]
          normalize: true
          precision: "fp32"
      max_num_steps: 240

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 10      # Reduced to keep cloud actor memory/compute below single-node
  global_batch_size: 120     # 120 % 10 == 0; rollout_per_rank=1200 % 120 == 0 ✓
  seed: 0
  enable_offload: False

  model:
    model_path: "checkpoints/pi05_rebot_insertion_pytorch"
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 4     # Reduced vs single-node (5) to lower sequence/output cost
    action_dim: 7
    num_steps: 4
    openpi:
      config_name: "pi05_rebot"
      value_after_vlm: True
      num_images_in_input: 1
      noise_method: "flow_noise"
      action_horizon: 6        # Reduced vs single-node (8) to lower rollout/actor cost
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
    openpi_data:
      repo_id: ""

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 2

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
